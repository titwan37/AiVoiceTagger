# AiVoiceTagger Production & Local Configuration

scanner:
  input_directory: "\\\\SyNAS\\Records"
  input_manifest: "inventory_manifest.csv"
  excluded_extensions: [".xlsx", ".csv", ".json", ".tmp", ".bak"]
  excluded_directories: ["#recycle", "recycle", "temp", "tmp", ".Trash"]
  recursive: true
  min_file_size_bytes: 1024

state_store:
  db_path: "aivoicetagger_state_interview.db" # <--- Changed this line
  busy_timeout_ms: 10000
  journal_mode: "WAL"
  synchronous: "NORMAL"

decoder:
  worker_threads: 3
  target_sample_rate: 16000
  channels: 1

stt:
  enabled: true
  no_context: true # Prevents previous context from feeding repeating hallucination loops
  temperature: 0.0 # Suppress temperature escalation when stuck
  logprob_thold: -1.0 # Set strict logprob threshold to bail out on bad audio
  provider: "parakeet" # options: "parakeet", "whisper", "auto"
  model_path: "models/ggml-small-q8_0.bin"
  parakeet_model_path: "models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/model.int8.onnx"
  diarization_enabled: true
  language: "fr"
  workers: 4
  threads_per_worker: 3
  beam_size: 1
  enable_timestamps: true
  chunk_length_seconds: 30
  adaptive_multipass: true
  heavy_model_path: "models/ggml-large-v3-q5_0.bin"
  heavy_workers: 2
  heavy_threads_per_worker: 5
  confidence_threshold: 0.65 # CRITICAL: Lowered to 0.65 to prevent "false negatives" where valid audio is rejected.
  intensity_threshold_rms: 0.15 # CRITICAL: Lowered to 0.15 (from 0.3) to catch quieter speech segments.
  triage_model_path: "models/DISABLED_FOR_FULL_TRANSCRIPT.bin" # Model for quick detection of "alive" audio.
  watchlist_file: "watchlist.txt"
  watchlist_keywords:
    - "harcèlement"
    - "chambre"
    - "cagibi"
    - "menace"
    - "insulte"
    - "avocat"
    - "police"
    - "tribunal"
    - "argent"
    - "preuve"
    - "justice"
    - "chantage"
    - "dégage"
    - "casse-toi"
    - "illégal"
    - "police"
    - "va te faire foutre"
    - "va chier"
    - "t'es nul"
    - "nabot"
    - "un gros nase"
    - "ta gueule"
    - "gros porc"
    - "vermine"
    - "gros nase"
    - "sale blanc bec"
    - "casser la gueule"
    - "mon frère"

sidecar:
  enabled: true
  python_executable: "python"
  script_path: "sidecar/main.py"
  worker_threads: 3
  timeout_seconds: 60

exporter:
  output_directory: "export"
  export_json: true
  export_csv: true
  export_parquet: false

pipeline:
  max_inflight_audio_mb: 1024
  max_inflight_chunks: 300
  max_retries: 5

logging:
  level: "info"
  format: "json"

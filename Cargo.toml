[package]
name = "aivoicetagger"
version = "0.1.0"
edition = "2021"
description = "Resilient, CPU-optimized hybrid Rust + Python batch audio processing & transcription engine"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
walkdir = "2.5"
regex = "1.10"
symphonia = { version = "0.5", features = ["all"] }
whisper-rs = "0.16.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
csv = "1.3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.10"
sha1 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio-util = "0.7"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
